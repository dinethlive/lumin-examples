name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tool-names:
    name: Tool names exist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.10"
      - run: bun scripts/check-tool-names.mjs

  typecheck:
    name: Typecheck and build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app:
          - today-panel
          - horary-desk
          - muhurta-scheduler
          - kundli-match
          - career-fit
          - wellness-matcher
          - products-matcher
          - health-risk-analyzer
          - weather-windows
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.10"
      - run: bun install --frozen-lockfile
      - run: bun run --filter ${{ matrix.app }} typecheck
      # Next builds on Node. Bun is the package manager and task runner here,
      # because Next 16 with Turbopack does not run under the Bun runtime.
      - run: bun run --filter ${{ matrix.app }} build
        env:
          ANTHROPIC_API_KEY: build-placeholder
          LUMIN_API_KEY: build-placeholder
